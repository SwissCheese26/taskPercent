<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Akku-Warnung</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { background: transparent; }
  body { padding: 14px; width: 100vw; height: 100vh; }
  .card { position: relative; height: 100%; display: grid; grid-template-columns: auto 1fr; gap: 0 18px; align-items: center; padding: 0 20px 0 22px;
    background: linear-gradient(135deg, #1A1013, var(--bg-0) 60%); border: 1px solid color-mix(in srgb, var(--tone-critical) 50%, transparent);
    border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.55), 0 0 36px color-mix(in srgb, var(--tone-critical) 30%, transparent); overflow: hidden;
    animation: in 520ms var(--ease) both; cursor: pointer; }
  .num { font-family: var(--font-display); font-weight: 700; font-size: 56px; letter-spacing: -.02em; color: var(--tone-critical); text-shadow: 0 0 24px var(--tone-glow); animation: pulse 1.1s ease-in-out infinite; }
  .num sup { font-size: 20px; vertical-align: top; position: relative; top: 6px; }
  h1 { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
  p { margin-top: 3px; font-size: 12.5px; color: var(--text-dim); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--bg-2); }
  .bar i { display: block; height: 100%; background: var(--tone-critical); box-shadow: 0 0 10px var(--tone-critical); transform-origin: left; animation: drain 12s linear forwards; }
  @keyframes in { from { opacity: 0; transform: translateX(40px) scale(.96); } }
  @keyframes pulse { 50% { opacity: .6; } }
  @keyframes drain { to { transform: scaleX(0); } }
</style>
</head>
<body data-state="critical">
<div class="card" id="card" role="alert">
  <div class="num"><span id="p">--</span><sup>%</sup></div>
  <div><h1>Akku fast leer</h1><p>Bitte jetzt das Netzteil anschließen.</p></div>
  <div class="bar"><i></i></div>
</div>
<script>
  document.getElementById('p').textContent = new URLSearchParams(location.search).get('p') || '--';
  document.getElementById('card').onclick = () => window.api && window.api.closeToast();
</script>
</body>
</html>
