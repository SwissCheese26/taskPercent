<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Akku-Warnung</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { background: transparent; }
  body { padding: 12px; width: 100vw; height: 100vh; }
  .card { height: 100%; display: flex; align-items: center; gap: 14px; padding: 0 18px;
    background: var(--surface); border-radius: 18px; box-shadow: 0 8px 32px rgba(0,0,0,.28), 0 0 0 1px var(--sep);
    animation: in 480ms var(--ease) both; cursor: pointer; }
  .icon { width: 44px; height: 44px; border-radius: 10px; background: var(--red); display: grid; place-items: center; flex: none; }
  .icon svg { width: 26px; height: 26px; }
  .txt { flex: 1; min-width: 0; }
  h1 { font: 600 15px var(--font); }
  p { margin-top: 2px; font-size: 13px; color: var(--text-2); }
  .pct { font: 600 28px var(--font-display); color: var(--red); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  @keyframes in { from { opacity: 0; transform: translateY(14px) scale(.96); filter: blur(6px); } }
</style>
</head>
<body data-state="critical">
<div class="card" id="card" role="alert">
  <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M22 10.5v3"/><path d="M6 10.5v3"/></svg></div>
  <div class="txt"><h1>Akku schwach</h1><p>Bitte jetzt das Netzteil anschließen.</p></div>
  <div class="pct"><span id="p">--</span>%</div>
</div>
<script src="toast.js"></script>
</body>
</html>
