<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>taskPercent – Geräte</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="devices.css">
</head>
<body data-state="normal">
<div class="app">
  <aside class="rail">
    <div class="brand"><i class="dot"></i>taskPercent</div>
    <nav role="tablist" aria-label="Bereiche">
      <button role="tab" data-tab="devices" aria-selected="true"><span class="ico" style="background:#007AFF"><svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg></span>Geräte</button>
      <button role="tab" data-tab="periph"><span class="ico" style="background:#34C759"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></span>Peripherie</button>
      <button role="tab" data-tab="mic"><span class="ico" style="background:#FF9500"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>Mikrofon</button>
      <button role="tab" data-tab="hearing"><span class="ico" style="background:#AF52DE"><svg viewBox="0 0 24 24"><path d="M7 9a5 5 0 0 1 10 0c0 3-3 3.5-3 6.5a2.5 2.5 0 0 1-5 0"/><path d="M12 9.5a1.5 1.5 0 0 1 3 0"/></svg></span>Hörtest</button>
      <button role="tab" data-tab="sound"><span class="ico" style="background:#FF2D55"><svg viewBox="0 0 24 24"><path d="M4 9v6M8 6v12M12 3v18M16 7v10M20 10v4"/></svg></span>Klang &amp; Bass</button>
    </nav>
    <div class="rail-foot"><button class="ghost" id="close">Schließen</button></div>
  </aside>

  <main>
    <section class="panel" id="tab-devices" role="tabpanel"><h1>Geräte</h1><p class="lead" id="devices-lead">Lade…</p><div id="devices-root"></div></section>
    <section class="panel" id="tab-periph" role="tabpanel" hidden><h1>Peripherie</h1><p class="lead" id="periph-lead">Lade…</p><div id="periph-root"></div></section>
    <section class="panel" id="tab-mic" role="tabpanel" hidden><h1>Mikrofon-Labor</h1><div id="mic-root"></div></section>
    <section class="panel" id="tab-hearing" role="tabpanel" hidden><h1>Hörtest</h1><div id="hearing-root"></div></section>
    <section class="panel" id="tab-sound" role="tabpanel" hidden><h1>Klang &amp; Bass</h1><div id="sound-root"></div></section>
  </main>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet"><h2 id="modal-title"></h2><div id="modal-body"></div><div class="row end" id="modal-actions"></div></div>
</div>

<script src="device-glyph.js"></script>
<script src="devices.js"></script>
<script src="tab-devices.js"></script>
<script src="tab-periph.js"></script>
<script src="tab-mic.js"></script>
<script src="tab-hearing.js"></script>
<script src="tab-sound.js"></script>
</body>
</html>
